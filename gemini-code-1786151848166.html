<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaukt Studio - Advanced</title>
    <!-- JSZip & FileSaver libraries for zip export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-titlebar: #161618;
            --bg-ribbon: #1a1a1c;
            --bg-sidebar: #1e1e20;
            --bg-editor: #121214;
            --bg-modal: #1e1e20;
            --bg-modal-nav: #161618;
            --bg-card: #26262a;
            --bg-hover: #2a2a2e;
            --bg-active: #323238;
            --border-color: #28282c;
            
            --text-normal: #dcddde;
            --text-muted: #8e8e93;
            --text-faint: #5a5a5e;
            
            --accent-purple: #7c3aed;
            --accent-purple-light: #a78bfa;
            --accent-purple-glow: rgba(124, 58, 237, 0.2);
            
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "SF Mono", "Source Code Pro", Menlo, Monaco, Consolas, monospace;
        }

        body.light-theme {
            --bg-titlebar: #e5e5e7;
            --bg-ribbon: #ededf0;
            --bg-sidebar: #f4f4f6;
            --bg-editor: #ffffff;
            --bg-modal: #f4f4f6;
            --bg-modal-nav: #e5e5e7;
            --bg-card: #e8e8ec;
            --bg-hover: #ddddf0;
            --bg-active: #d0d0e0;
            --border-color: #d1d1d6;
            
            --text-normal: #1c1c1e;
            --text-muted: #636366;
            --text-faint: #8e8e93;
            
            --accent-purple: #6d28d9;
            --accent-purple-light: #7c3aed;
            --accent-purple-glow: rgba(109, 40, 217, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-titlebar); color: var(--text-normal); height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 13px; font-family: var(--font-ui); transition: background-color 0.2s, color 0.2s; }

        .window-header { height: 38px; background: var(--bg-titlebar); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        .window-controls { display: flex; gap: 8px; }
        .mac-btn { width: 12px; height: 12px; border-radius: 50%; }
        .mac-close { background: #ff5f56; }
        .mac-min { background: #ffbd2e; }
        .mac-max { background: #27c93f; }
        .window-title { color: var(--text-muted); font-size: 12px; font-family: var(--font-mono); display: flex; align-items: center; gap: 8px; }

        .app-container { flex: 1; display: flex; overflow: hidden; }

        /* Ribbon */
        .ribbon { width: 44px; background: var(--bg-ribbon); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 14px; color: var(--text-muted); }
        .ribbon-btn { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; font-size: 14px; }
        .ribbon-btn:hover { background: var(--bg-hover); color: var(--text-normal); }
        .ribbon-btn.active { color: var(--accent-purple-light); background: var(--accent-purple-glow); }
        .ribbon-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

        /* Sidebar */
        .sidebar { width: 300px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px 14px 8px 14px; display: flex; justify-content: space-between; align-items: center; }
        .vault-name { font-weight: 600; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px; color: var(--text-muted); cursor: pointer;}
        .sidebar-actions { display: flex; gap: 8px; color: var(--text-muted); }
        .sidebar-actions i { cursor: pointer; padding: 4px; border-radius: 4px; }
        .sidebar-actions i:hover { background: var(--bg-hover); color: var(--text-normal); }

        .search-container { padding: 0 10px 8px 10px; }
        .search-trigger-input { width: 100%; background: var(--bg-ribbon); border: 1px solid var(--border-color); border-radius: 4px; padding: 6px 8px; color: var(--text-muted); font-size: 11px; font-family: var(--font-mono); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }

        .view-tab-selector { display: flex; margin: 0 10px 8px 10px; background: var(--bg-ribbon); border: 1px solid var(--border-color); border-radius: 4px; padding: 2px; }
        .view-tab-btn { flex: 1; border: none; background: transparent; color: var(--text-muted); font-size: 11px; font-family: var(--font-mono); padding: 5px; border-radius: 3px; cursor: pointer; text-align: center; transition: all 0.15s; }
        .view-tab-btn.active { background: var(--bg-card); color: var(--text-normal); font-weight: 600; }

        .notebook-navigator-list { flex: 1; overflow-y: auto; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
        
        /* Folders & Notes styling */
        .folder-item { padding: 6px 10px; font-weight: bold; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .folder-item:hover { color: var(--text-normal); }
        .note-card { padding: 8px 10px; border-radius: 6px; background: transparent; cursor: grab; display: flex; flex-direction: column; gap: 4px; border: 1px solid transparent; transition: background 0.1s, border-color 0.1s; position: relative; margin-left: 12px;}
        .note-card:active { cursor: grabbing; }
        .note-card:hover { background: var(--bg-hover); }
        .note-card.active { background: var(--bg-active); border-color: var(--border-color); }
        
        .note-card-title { font-weight: 600; font-size: 12px; color: var(--text-normal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px; display: flex; align-items: center; gap: 6px;}
        
        .workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg-editor); overflow: hidden; }
        
        /* Tabs Container */
        .tab-bar { height: 36px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 8px; overflow: visible; }
        .tab-left { display: flex; align-items: flex-end; gap: 2px; overflow-x: auto; flex: 1; padding-top: 6px; }
        
        /* Individual Tab */
        .tab { height: 30px; padding: 0 10px; background: var(--bg-ribbon); border-radius: 6px 6px 0 0; display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 12px; font-family: var(--font-mono); border: 1px solid var(--border-color); border-bottom: none; cursor: pointer; max-width: 180px; min-width: 100px; position: relative; }
        .tab.active { background: var(--bg-editor); color: var(--text-normal); border-bottom: 1px solid var(--bg-editor); margin-bottom: -1px; z-index: 2; }
        .tab:hover:not(.active) { background: var(--bg-hover); }
        .tab-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; pointer-events: none; }
        .tab-close { opacity: 0; padding: 2px 4px; border-radius: 4px; font-size: 10px; color: var(--text-faint); transition: all 0.1s; }
        .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
        
        .tab-actions { display: flex; gap: 8px; align-items: center; margin-left: 12px; }
        .editor-action-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 10px; border-radius: 4px; font-size: 11px; font-family: var(--font-mono); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
        .editor-action-btn:hover, .editor-action-btn.active { color: var(--text-normal); background: var(--bg-hover); border-color: var(--accent-purple-light); }

        .workspace-content { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* Split Pane for Edit / Preview */
        .editor-pane-container { flex: 1; display: flex; overflow: hidden; }
        .editor-pane, .preview-pane { flex: 1; padding: 28px 42px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; user-select: text; }
        .preview-pane { background: var(--bg-ribbon); border-left: 1px solid var(--border-color); display: none; }
        .preview-pane.active { display: flex; }

        /* Properties Block */
        .properties-block { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 14px; font-size: 11px; display: flex; flex-direction: column; gap: 8px; }
        .property-row { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 10px; font-family: var(--font-mono); }
        .property-label { color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .property-input { background: transparent; border: none; color: var(--text-normal); font-family: var(--font-mono); font-size: 11px; outline: none; width: 100%; }

        .note-title-input { font-size: 1.8rem; font-weight: 700; color: var(--text-normal); background: transparent; border: none; outline: none; width: 100%; font-family: var(--font-mono); }
        .note-body-textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--text-normal); font-size: 13px; line-height: 1.65; resize: none; font-family: var(--font-mono); min-height: 280px; }

        /* Graph Pane */
        .graph-pane { width: 340px; background: var(--bg-ribbon); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; position: relative; transition: all 0.2s; }
        .graph-pane.collapsed { display: none; }
        .graph-header { padding: 8px 12px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); background: var(--bg-sidebar); }
        .graph-canvas-container { flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; cursor: grab; }
        #graphCanvas { width: 100%; height: 100%; display: block; }

        /* Command Palette */
        .command-palette-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 9999; display: none; justify-content: center; align-items: flex-start; padding-top: 10vh; }
        .command-palette { width: 600px; background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; }
        .cmd-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-color); padding: 16px; color: var(--text-normal); font-size: 16px; outline: none; font-family: var(--font-mono); }
        .cmd-results { max-height: 300px; overflow-y: auto; }
        .cmd-item { padding: 12px 16px; color: var(--text-muted); display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: var(--font-mono); font-size: 13px; }
        .cmd-item:hover, .cmd-item.active { background: var(--accent-purple-glow); color: var(--accent-purple-light); }

        /* Markdown Preview Styles */
        .markdown-body { color: var(--text-normal); line-height: 1.6; font-family: var(--font-ui); }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-family: var(--font-mono); margin-top: 1em; margin-bottom: 0.5em; color: var(--text-normal); }
        .markdown-body a { color: var(--accent-purple-light); text-decoration: none; }
        .markdown-body code { background: var(--bg-card); padding: 2px 4px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.9em; }
        .markdown-body pre { background: var(--bg-card); padding: 12px; border-radius: 6px; overflow-x: auto; }
        
        /* Backlinks Section */
        .backlinks-section { margin-top: 20px; padding-top: 10px; border-top: 1px dashed var(--border-color); }
        .backlinks-title { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .backlink-item { font-size: 12px; color: var(--accent-purple-light); cursor: pointer; display: block; margin-bottom: 4px; }
        .backlink-item:hover { text-decoration: underline; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="window-header">
        <div class="window-controls">
            <div class="mac-btn mac-close"></div>
            <div class="mac-btn mac-min"></div>
            <div class="mac-btn mac-max"></div>
        </div>
        <div class="window-title"><i class="fa-solid fa-vault"></i> Vaukt Studio - Advanced</div>
        <div></div>
    </header>

    <div class="app-container">
        <!-- Ribbon -->
        <nav class="ribbon">
            <div class="ribbon-btn active" title="Files Explorer"><i class="fa-regular fa-folder-open"></i></div>
            <div class="ribbon-btn" title="Search (Ctrl/Cmd+Shift+F)"><i class="fa-solid fa-magnifying-glass"></i></div>
            <div class="ribbon-btn active" title="Graph View" onclick="toggleGraphPane()"><i class="fa-solid fa-circle-nodes"></i></div>
            <div class="ribbon-btn" title="Whiteboard / Canvas"><i class="fa-solid fa-pen-ruler"></i></div>
            <div class="ribbon-btn" title="Bookmarks"><i class="fa-regular fa-bookmark"></i></div>
            <div class="ribbon-bottom">
                <div class="ribbon-btn" title="AI Assistant"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <div class="ribbon-btn" title="Command Palette (Ctrl/Cmd+K)" onclick="openCommandPalette()"><i class="fa-solid fa-terminal"></i></div>
                <div class="ribbon-btn" title="Settings"><i class="fa-solid fa-gear"></i></div>
            </div>
        </nav>

        <!-- Sidebar Pane -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="vault-name" onclick="selectLocalVault()"><i class="fa-solid fa-hard-drive"></i> Local Vault</span>
                <div class="sidebar-actions">
                    <i class="fa-solid fa-folder-plus" title="New Folder"></i>
                    <i class="fa-solid fa-file-circle-plus" title="New Note" onclick="createNewNote()"></i>
                </div>
            </div>

            <div class="view-tab-selector">
                <button class="view-tab-btn active">Files</button>
                <button class="view-tab-btn">Tags</button>
            </div>

            <!-- Note List / Folder Tree -->
            <div class="notebook-navigator-list" id="navigatorList">
                <div class="folder-item"><i class="fa-solid fa-chevron-down"></i> Projects</div>
                <div class="note-card active" onclick="loadNote(1)">
                    <div class="note-card-title"><i class="fa-brands fa-markdown" style="color: var(--text-faint)"></i> Master Plan.md</div>
                </div>
                <div class="folder-item"><i class="fa-solid fa-chevron-right"></i> Archive</div>
            </div>
        </aside>

        <!-- Workspace -->
        <main class="workspace">
            <div class="tab-bar">
                <div class="tab-left" id="tabContainer">
                    <div class="tab active">
                        <i class="fa-brands fa-markdown" style="color: var(--accent-purple-light)"></i>
                        <span class="tab-title">Master Plan.md</span>
                        <i class="fa-solid fa-xmark tab-close"></i>
                    </div>
                </div>
                <div class="tab-actions">
                    <button class="editor-action-btn" title="Toggle Live Preview" onclick="togglePreview()">
                        <i class="fa-solid fa-book-open"></i> Preview
                    </button>
                    <button class="editor-action-btn" title="Attach File">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <button class="editor-action-btn" title="Export this note as .md">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>

            <div class="workspace-content">
                <!-- Split Pane -->
                <div class="editor-pane-container">
                    <div class="editor-pane" id="editorPane">
                        <input type="text" id="noteTitle" class="note-title-input" value="Master Plan" oninput="updateNote()">

                        <div class="properties-block">
                            <div class="property-row">
                                <span class="property-label"><i class="fa-regular fa-calendar-days"></i> date</span>
                                <input type="date" id="propCreated" class="property-input" value="2026-08-08">
                            </div>
                            <div class="property-row">
                                <span class="property-label"><i class="fa-solid fa-tags"></i> tags</span>
                                <input type="text" id="propTags" class="property-input" placeholder="e.g. #projects, #ideas" value="#projects">
                            </div>
                        </div>

                        <textarea id="noteContent" class="note-body-textarea" oninput="updateNote()"># Master Plan
This is an example note demonstrating the **Markdown Editor** and **Live Preview**.

## Features enabled:
* Markdown parsing
* Internal linking like [[Ideas]]
* Tags #projects

Use the command palette (`Ctrl/Cmd+K`) to search or trigger actions. Local File System API logic is ready for integration.</textarea>
                    </div>

                    <!-- Live Preview Pane -->
                    <div class="preview-pane" id="previewPane">
                        <div class="note-title-input" id="previewTitle" style="margin-bottom: 20px;">Master Plan</div>
                        <div id="previewContent" class="markdown-body"></div>
                        
                        <!-- Backlinks -->
                        <div class="backlinks-section">
                            <div class="backlinks-title">Linked Mentions (Backlinks)</div>
                            <div id="backlinksContainer">
                                <span class="backlink-item"><i class="fa-solid fa-link"></i> Ideas Note</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Canvas Graph Pane -->
                <div class="graph-pane" id="graphPane">
                    <div class="graph-header">
                        <span><i class="fa-solid fa-diagram-project" style="margin-right:4px;"></i> LOCAL GRAPH</span>
                        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="toggleGraphPane()"></i>
                    </div>
                    <div class="graph-canvas-container">
                        <canvas id="graphCanvas"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Command Palette Modal -->
    <div class="command-palette-overlay" id="cmdPalette" onclick="closeCommandPalette(event)">
        <div class="command-palette" onclick="event.stopPropagation()">
            <input type="text" class="cmd-input" id="cmdInput" placeholder="Type a command or search notes...">
            <div class="cmd-results">
                <div class="cmd-item"><i class="fa-solid fa-file-circle-plus"></i> Create new note</div>
                <div class="cmd-item"><i class="fa-solid fa-folder-open"></i> Open local vault folder...</div>
                <div class="cmd-item"><i class="fa-solid fa-moon"></i> Toggle Dark/Light Theme</div>
                <div class="cmd-item"><i class="fa-solid fa-wand-magic-sparkles"></i> Ask AI to summarize current note</div>
            </div>
        </div>
    </div>

    <script>
        let isPreviewOpen = false;
        
        // Setup marked.js options
        if(typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,
                gfm: true
            });
        }

        function updateNote() {
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;
            
            if(isPreviewOpen) {
                document.getElementById('previewTitle').innerText = title;
                // Parse markdown and custom [[links]]
                let parsedHtml = marked.parse(content);
                
                // Super basic internal link [[Note]] parsing for visual representation
                parsedHtml = parsedHtml.replace(/\[\[(.*?)\]\]/g, '<a href="#" style="color:var(--accent-purple-light); font-weight:bold;">[[$1]]</a>');
                
                document.getElementById('previewContent').innerHTML = parsedHtml;
            }
        }

        function togglePreview() {
            isPreviewOpen = !isPreviewOpen;
            const previewPane = document.getElementById('previewPane');
            if(isPreviewOpen) {
                previewPane.classList.add('active');
                updateNote();
            } else {
                previewPane.classList.remove('active');
            }
        }

        function toggleGraphPane() {
            const pane = document.getElementById('graphPane');
            pane.classList.toggle('collapsed');
            drawMockGraph();
        }

        // Command Palette Logic
        function openCommandPalette() {
            document.getElementById('cmdPalette').style.display = 'flex';
            document.getElementById('cmdInput').focus();
        }
        function closeCommandPalette(e) {
            if(e.target.id === 'cmdPalette') {
                document.getElementById('cmdPalette').style.display = 'none';
            }
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            // Cmd/Ctrl + K for Command Palette
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                openCommandPalette();
            }
        });

        // Mock Graph Drawing
        function drawMockGraph() {
            const canvas = document.getElementById('graphCanvas');
            if(!canvas || canvas.offsetParent === null) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw dummy nodes
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, canvas.height/2);
            ctx.lineTo(canvas.width/2 + 50, canvas.height/2 - 40);
            ctx.strokeStyle = 'rgba(124, 58, 237, 0.4)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#a78bfa";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(canvas.width/2 + 50, canvas.height/2 - 40, 4, 0, Math.PI * 2);
            ctx.fillStyle = "#7c3aed";
            ctx.fill();
        }

        // Local Vault File System API Hook (Visual placeholder logic for modern browsers)
        async function selectLocalVault() {
            try {
                if ('showDirectoryPicker' in window) {
                    const dirHandle = await window.showDirectoryPicker();
                    alert(`Vault selected: ${dirHandle.name}. File syncing would initialize here.`);
                    // Logic to iterate over dirHandle.values() and populate the nested sidebar tree goes here.
                } else {
                    alert("Your browser does not support the Local File System Access API. Falling back to IndexedDB storage.");
                }
            } catch (err) {
                console.error("User cancelled or error:", err);
            }
        }

        // Initialize view
        setTimeout(drawMockGraph, 100);
    </script>
</body>
</html>
